[workspace]
name = "pypsa-monte_carlo"
channels = ["conda-forge", "bioconda", "gurobi"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
snakemake-minimal = ">=8"
pypsa = ">=0.30"
scipy = "*"
pandas = "*"
numpy = "*"
highspy = "*"
netcdf4 = "*"
gurobi = ">=12.0.3"

[tasks]
run = "snakemake -j 4 --configfile config/config.yaml"
