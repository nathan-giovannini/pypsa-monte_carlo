[workspace]
name = "pypsa-monte_carlo"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11"
snakemake = ">=8"
pypsa = ">=0.30"
scipy = "*"
pandas = "*"
numpy = "*"
highspy = "*"
netcdf4 = "*"

[tasks]
run = "snakemake -j 4 --configfile config/config.yaml"
